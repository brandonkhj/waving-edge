    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["Organization", "ProfessionalService"],
            "@id": "https://www.wavingedge.com/#organization",
            "name": "Waving Edge Venture",
            "url": "https://www.wavingedge.com/",
            "logo": "https://www.wavingedge.com/apple-touch-icon.png",
            "email": "hello@wavingedge.com",
            "description": "Independent software development studio building custom web applications, internal business systems, SaaS products, e-commerce integrations and automation for SMEs and startups.",
            "areaServed": [
              { "@type": "Country", "name": "Malaysia" },
              { "@type": "Place", "name": "International" }
            ],
            "slogan": "Software built around your business.",
            "knowsLanguage": ["en", "ms"],
            "knowsAbout": [
              "Custom Software Development",
              "Web Application Development",
              "Business Systems and Internal Tools",
              "SaaS and MVP Development",
              "API Integrations and Automation",
              "E-commerce Development",
              "Software Maintenance and Support"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "sales",
              "email": "hello@wavingedge.com",
              "availableLanguage": ["en", "ms"]
            },
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Software development services",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Build a new product",
                    "description": "Turn an idea into a practical MVP or production-ready web app without over-engineering the first version. SaaS platforms, MVPs, customer portals and web apps."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Digitise business operations",
                    "description": "Replace spreadsheets, manual processes and disconnected tools with an app designed around your actual workflows. Internal management, booking, rental and inventory systems, and operations dashboards."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Integrations and automation",
                    "description": "Connect the systems you already use and remove repetitive, manual work. API integrations, payment gateways, SMS and messaging, email systems, Shopify and other third-party services."
                  }
                },
                {
                  "@type": "Offer",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Improve existing software",
                    "description": "Modernise, extend, maintain or repair the app your business already relies on. Feature development, UI modernisation, performance improvements, legacy system work and ongoing maintenance."
                  }
                }
              ]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.wavingedge.com/#website",
            "url": "https://www.wavingedge.com/",
            "name": "Waving Edge Venture",
            "publisher": { "@id": "https://www.wavingedge.com/#organization" }
          }
        ]
      }
    </script>
