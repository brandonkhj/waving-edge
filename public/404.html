<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f6f2e9" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Page not found — Waving Edge Venture</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Fraunces:ital,wght@1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <!--
      Standalone page: styles are inlined so this loads instantly and cannot break
      if the app bundle fails. Palette values mirror the tokens in src/index.css —
      that file is the source of truth; update both together if the palette changes.
    -->
    <style>
      :root {
        --canvas: #f6f2e9;
        --surface-card: #fffdf8;
        --ink: #1c1d18;
        --body: #57584e;
        --muted: #85846f;
        --hairline: #e4dcc8;
        --primary: #16231a;
        --primary-active: #263b2c;
        --on-primary: #f6f2e9;
        --accent: oklch(52% 0.09 200);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--canvas);
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--body);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 24px;
        overflow-x: hidden;
        position: relative;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        margin-bottom: 56px;
      }

      .brand-name {
        display: flex;
        flex-direction: column;
        line-height: 1.05;
        text-align: left;
      }

      .brand-title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--ink);
      }

      .brand-subtitle {
        font-size: 9px;
        letter-spacing: 0.2em;
        color: var(--muted);
        font-weight: 500;
      }

      .code {
        font-family: 'Space Grotesk', sans-serif;
        font-size: clamp(72px, 16vw, 140px);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--hairline);
        margin: 0 0 8px;
        user-select: none;
      }

      .accent {
        font-family: 'Fraunces', Georgia, serif;
        font-style: italic;
        font-size: 17px;
        color: var(--accent);
        margin: 0 0 20px;
      }

      h1 {
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        font-size: clamp(26px, 4.5vw, 38px);
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -0.8px;
        color: var(--ink);
        margin: 0 0 16px;
        text-wrap: pretty;
      }

      p.lead {
        font-size: 16px;
        line-height: 1.55;
        color: var(--body);
        margin: 0 auto 36px;
        max-width: 440px;
        text-wrap: pretty;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: center;
        margin-bottom: 44px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        line-height: 1;
        border-radius: 9999px;
        padding: 14px 26px;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--on-primary);
      }

      .btn-primary:hover {
        background: var(--primary-active);
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid var(--hairline);
        color: var(--ink);
      }

      .btn-secondary:hover {
        border-color: var(--ink);
        background: var(--surface-card);
      }

      .jump {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
        justify-content: center;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .jump a {
        font-size: 13.5px;
        color: var(--muted);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .jump a:hover {
        color: var(--ink);
      }

      .waves {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        pointer-events: none;
        opacity: 0.45;
      }

      @media (max-width: 600px) {
        .brand {
          margin-bottom: 36px;
        }

        .actions {
          flex-direction: column;
          align-items: stretch;
          width: 100%;
          max-width: 300px;
          margin-inline: auto;
        }

        .btn {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <a class="brand" href="/">
      <svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true">
        <path
          d="M2 14 Q9 4 17 14 T32 14"
          stroke="oklch(52% 0.09 200)"
          stroke-width="2.5"
          fill="none"
          stroke-linecap="round"
        />
      </svg>
      <span class="brand-name">
        <span class="brand-title">Waving Edge</span>
        <span class="brand-subtitle">VENTURE</span>
      </span>
    </a>

    <p class="code">404</p>
    <p class="accent">Off the map</p>

    <h1>This page drifted off course.</h1>
    <p class="lead">
      The page you're looking for doesn't exist, or it has moved. Let's get you back to
      solid ground.
    </p>

    <div class="actions">
      <a class="btn btn-primary" href="/">Back to home →</a>
      <a class="btn btn-secondary" href="/#services">Explore our services</a>
    </div>

    <ul class="jump">
      <li><a href="/#services">Services</a></li>
      <li><a href="/#solutions">Solutions</a></li>
      <li><a href="/#about">About</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>

    <svg
      class="waves"
      width="1800"
      height="120"
      viewBox="0 0 1800 120"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <path
        d="M0 70 Q150 30 300 70 T600 70 T900 70 T1200 70 T1500 70 T1800 70"
        stroke="oklch(52% 0.09 200)"
        stroke-width="2"
        fill="none"
      />
      <path
        d="M0 95 Q150 55 300 95 T600 95 T900 95 T1200 95 T1500 95 T1800 95"
        stroke="#e4dcc8"
        stroke-width="2"
        fill="none"
      />
    </svg>
  </body>
</html>
